<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Shikigami — аватар</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  canvas { display: block; }
  /* края окна не видны: дым «пуфа», сердечки, листья и концы волос растворяются у границы, а не обрезаются линией.
     Модель кадр держит с запасом (frame()), так что полоса растворения её не задевает */
  body:not(.cam):not(.room) canvas {
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%),
                        linear-gradient(to bottom, transparent 0, #000 5%, #000 95%, transparent 100%);
    -webkit-mask-composite: source-in; mask-composite: intersect;
  }
  #bubble {
    position: absolute; left: 12px; right: 12px; top: 8px; padding: 10px 14px; border-radius: 16px;
    background: rgba(23, 17, 13, .86); color: #f3e9df; font: 14px/1.45 "Segoe UI Variable", "Segoe UI", sans-serif;
    border: 1px solid rgba(255, 200, 150, .22); box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
    opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s; pointer-events: none;
    max-height: 40%; overflow: hidden;
  }
  #bubble.show { opacity: 1; transform: none; }
  /* «вебка» поверх игры: квадрат в углу, облачко снизу мелким шрифтом, рамка по желанию */
  body.cam #bubble { top: auto; bottom: 6px; left: 6px; right: 6px; padding: 5px 8px; font-size: 11px; border-radius: 10px; max-height: 45%; }
  body.cam #state, body.cam #menu { display: none !important; }
  body.cam-frame { box-sizing: border-box; border: 2px solid rgba(240, 160, 60, .7); border-radius: 14px;
    background: radial-gradient(circle at 50% 35%, rgba(60, 46, 36, .55), rgba(23, 17, 13, .75)); }
  #bubble i { color: #f0a03c; }
  #state { position: absolute; right: 14px; bottom: 10px; font: 12px "Segoe UI", sans-serif; color: #f0a03c;
    text-shadow: 0 1px 3px #000; opacity: 0; transition: opacity .2s; }
  #state.show { opacity: 1; }
  #menu { position: absolute; display: none; min-width: 180px; padding: 6px; border-radius: 12px; z-index: 10;
    background: rgba(23, 17, 13, .95); border: 1px solid rgba(255, 200, 150, .25); box-shadow: 0 10px 30px rgba(0,0,0,.5);
    font: 13px "Segoe UI Variable", "Segoe UI", sans-serif; color: #f3e9df; }
  #menu.show { display: block; }
  #menu div { padding: 6px 10px; border-radius: 8px; cursor: pointer; white-space: pre; }
  #menu div:hover { background: rgba(240, 160, 60, .25); }
  #menu .food { display: flex; justify-content: space-between; font-size: 18px; padding: 4px 6px; cursor: default; }
  #menu .food:hover { background: none; }
  #menu .food span { cursor: pointer; border-radius: 6px; padding: 0 3px; transition: transform .12s; }
  #menu .food span:hover { transform: scale(1.3); background: rgba(240, 160, 60, .25); }
  #menu hr { border: 0; border-top: 1px solid rgba(255, 200, 150, .15); margin: 4px 2px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/",
  "@pixiv/three-vrm": "/vendor/@pixiv/three-vrm/lib/three-vrm.module.js"
} }
</script>
</head>
<body>
<div id="bubble"></div>
<div id="state"></div>
<div id="menu"></div>
<script src="/ui/i18n.js"></script>
<script type="module" src="/ui/avatar.js"></script>
</body>
</html>
