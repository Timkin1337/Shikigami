<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Фокус с {name}</title>
<style>
  :root { --bg: #0e0b09; --glass: rgba(255,240,225,.06); --line: rgba(255,200,150,.16); --text: #f3e9df;
    --muted: #b3a294; --accent: #f0a03c; --rest: #8fd3a8; --font: "Segoe UI Variable","Segoe UI",system-ui; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font);
    display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 28px 16px; }
  .ring { position: relative; width: 240px; height: 240px; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 12; }
  .ring .bg { stroke: var(--glass); }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke .3s; }
  .ring.rest .fg { stroke: var(--rest); }
  .time { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .time b { font-size: 52px; font-variant-numeric: tabular-nums; }
  .time small { display: block; color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .btn { background: var(--glass); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 18px; font: inherit; cursor: pointer; }
  .btn.primary { background: rgba(240,160,60,.18); border-color: var(--accent); }
  .btn:hover { border-color: var(--accent); }
  input { background: var(--glass); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; }
  input[type=number] { width: 70px; }
  .stats { color: var(--muted); }
  .stats b { color: var(--text); }
  .tomatoes { font-size: 22px; letter-spacing: 4px; min-height: 28px; }
</style>
</head>
<body>
<div class="ring" id="ring">
  <svg width="240" height="240"><circle class="bg" cx="120" cy="120" r="104"/><circle class="fg" id="arc" cx="120" cy="120" r="104"/></svg>
  <div class="time"><div><b id="clock">25:00</b><small id="phase">готовы?</small></div></div>
</div>
<div class="row">
  <input id="task" placeholder="Над чем работаем?" size="28">
  <input id="minutes" type="number" min="1" max="120" value="25" title="Минут работы"> мин
</div>
<div class="row">
  <button class="btn primary" id="start">▶ Начать</button>
  <button class="btn" id="stop">■ Стоп</button>
</div>
<div class="tomatoes" id="tomatoes"></div>
<div class="stats">Сегодня: <b id="today">0</b> · всего: <b id="total">0</b></div>

<script src="/ui/i18n.js"></script>
<script>
const API = "/api/plugins/focus";
const $ = (s) => document.querySelector(s);
const post = (p, b = {}) => fetch(API + p, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b) }).then((r) => r.json());
const C = 2 * Math.PI * 104;
$("#arc").style.strokeDasharray = C;
let s = null, t0 = 0;
function draw() {
  if (!s) return;
  const left = s.phase ? Math.max(0, s.left - (Date.now() - t0) / 1000) : s.work * 60;
  const full = (s.phase === "rest" ? (s.done_today % 4 === 0 ? 15 : s.rest) : s.work) * 60;
  const m = Math.floor(left / 60), sec = Math.floor(left % 60);
  $("#clock").textContent = `${m}:${String(sec).padStart(2, "0")}`;
  $("#phase").textContent = s.phase === "work" ? (s.task || "работаем") : s.phase === "rest" ? "перерыв" : "готовы?";
  $("#ring").classList.toggle("rest", s.phase === "rest");
  $("#arc").style.strokeDashoffset = C * (1 - left / full);
  $("#today").textContent = s.done_today; $("#total").textContent = s.total;
  $("#tomatoes").textContent = "🍅".repeat(s.done_today % 4 || (s.done_today ? 4 : 0));
}
function apply(st) { s = st; t0 = Date.now(); if (!$("#task").matches(":focus")) $("#task").value = st.task || $("#task").value; draw(); }
$("#start").onclick = async () => apply(await post("/start", { minutes: +$("#minutes").value, task: $("#task").value }));
$("#stop").onclick = async () => apply(await post("/stop"));
setInterval(draw, 500);
setInterval(() => fetch(API + "/state").then((r) => r.json()).then(apply), 5000);
fetch(API + "/state").then((r) => r.json()).then((st) => { $("#minutes").value = st.work; apply(st); });
</script>
</body>
</html>
